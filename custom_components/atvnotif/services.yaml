notify:
  name: Send Notification
  description: Send a fully-featured notification to the Android TV Notifier app.
  fields:
    message:
      name: Message
      description: The notification body text.
      required: true
      example: "Someone is at the door!"
      selector:
        text:
    title:
      name: Title
      description: Notification title shown above the message.
      required: false
      default: "Home Assistant"
      example: "Doorbell"
      selector:
        text:
    sender:
      name: Sender
      description: "App/source name shown on the notification. If omitted, the sender is hidden."
      required: false
      example: "Home Assistant"
      selector:
        text:
    duration:
      name: Duration (seconds)
      description: How long the notification stays on screen (1–300).
      required: false
      default: 15
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s
    position:
      name: Position
      description: "Screen position: 0=Top-Right, 1=Top-Left, 2=Bottom-Right, 3=Bottom-Left."
      required: false
      default: 0
      selector:
        select:
          options:
            - label: "Top-Right"
              value: "0"
            - label: "Top-Left"
              value: "1"
            - label: "Bottom-Right"
              value: "2"
            - label: "Bottom-Left"
              value: "3"
    priority:
      name: Priority
      description: "0=Low, 1=Default, 2=High."
      required: false
      default: 1
      selector:
        select:
          options:
            - label: "Low"
              value: "0"
            - label: "Default"
              value: "1"
            - label: "High"
              value: "2"
    bg_color:
      name: Background Color
      description: Background color for the notification.
      required: false
      selector:
        color_rgb: {}
    title_color:
      name: Title Color
      description: Title text color.
      required: false
      selector:
        color_rgb: {}
    msg_color:
      name: Message Color
      description: Message text color.
      required: false
      selector:
        color_rgb: {}
    title_size:
      name: Title Font Size
      description: Title text size (float, e.g. 16.0).
      required: false
      selector:
        number:
          min: 8
          max: 72
          step: 0.5
          mode: box
    msg_size:
      name: Message Font Size
      description: Message text size (float, e.g. 14.0).
      required: false
      selector:
        number:
          min: 8
          max: 72
          step: 0.5
          mode: box
    icon:
      name: Icon URL
      description: URL of a large icon image to display on the notification.
      required: false
      example: "https://i.imgur.com/example.png"
      selector:
        text:
    small_icon:
      name: Small Icon URL
      description: URL of a small icon image.
      required: false
      selector:
        text:
    big_image:
      name: Big Image URL
      description: URL of a full-width image shown below the notification.
      required: false
      selector:
        text:
    interact:
      name: Require Interaction
      description: If true, the notification stays until the user dismisses it.
      required: false
      default: false
      selector:
        boolean:
    notif_sound:
      name: Play Sound
      description: Play the notification sound on the TV.
      required: false
      default: true
      selector:
        boolean:
    wakeup:
      name: Wake Up TV
      description: Wake the TV screen when the notification arrives.
      required: false
      default: false
      selector:
        boolean:
    host:
      name: Host (optional)
      description: IP address of the TV to target. Uses first configured TV if omitted.
      required: false
      example: "192.168.1.100"
      selector:
        text:
    device_id:
      name: Device (optional)
      description: Target a specific configured Android TV Notifier device.
      required: false
      selector:
        device:
          integration: atvnotif

open_app:
  name: Open App
  description: Launch an app on the Android TV by package name.
  fields:
    package_name:
      name: Package Name
      description: The Android package name of the app to launch (e.g. com.netflix.ninja).
      required: true
      example: "com.netflix.ninja"
      selector:
        text:
    host:
      name: Host (optional)
      description: IP address of the TV to target. If omitted, the first configured TV is used.
      required: false
      example: "192.168.1.100"
      selector:
        text:
    device_id:
      name: Device (optional)
      description: Target a specific configured Android TV Notifier device.
      required: false
      selector:
        device:
          integration: atvnotif

info:
  name: Get Device Info
  description: Get device details from the Android TV Notifier app.
  target:
    device:
      integration: atvnotif
  fields:
    host:
      name: Host (optional)
      description: IP address of the TV. If omitted, uses the first configured TV.
      required: false
      example: "192.168.2.104"
      selector:
        text:

apps:
  name: Get Installed Apps
  description: Retrieve the list of apps installed on the targeted TV.
  target:
    device:
      integration: atvnotif
  fields:
    host:
      name: Host (optional)
      description: IP address of the TV. If omitted, uses the first configured TV.
      required: false
      example: "192.168.2.104"
      selector:
        text:

discover:
  name: Discover TV Devices
  description: Scan the local network for active Android TV Notifier devices.
  target:
    device:
      integration: atvnotif
  fields:
    timeout:
      name: Timeout
      description: How long to scan the network in seconds.
      required: false
      default: 6.0
      selector:
        number:
          min: 1.0
          max: 30.0
          step: 0.5
          unit_of_measurement: s

qr:
  name: Decode QR Image
  description: Extract pairing credentials (IP/code/name) from a QR code image (URL, local path, or Base64 string).
  target:
    device:
      integration: atvnotif
  fields:
    image:
      name: Image Input
      description: The QR code image as an HTTP/HTTPS URL, absolute local file path, or Base64 data string.
      required: true
      example: "http://192.168.2.4:8123/local/pairing_qr.png"
      selector:
        text:



